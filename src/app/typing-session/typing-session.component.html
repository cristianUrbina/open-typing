<div class="page">
  <div class="main">
    <div class="typing-wrapper">
      <!-- Typing editor with fixed width -->
      <app-typing-editor
        #typingEditor
        [language]="lang"
        [code]="gameService.codeSnippet"
      ></app-typing-editor>

      <div class="chip-container">
        <mat-chip class="language-chip">
          <img
            matChipAvatar
            [src]="langImgUrl"
            alt="Programming language logo"
          />
          {{ capitalizedLang }}
        </mat-chip>
        <div *ngIf="gameService.hasFinished()">
          <button
            mat-raised-button
            color="primary"
            (click)="restart()"
            class="restart-btn"
            class="language-chip"
          >
            <mat-icon>restart_alt</mat-icon> Restart
          </button>
      </div>
      </div>
    </div>

    <!-- Fixed position for score container -->
    <div class="score-container">
      <div class="score-item"><strong>WPM:</strong> {{ gameService.WPM }}</div>
      <div class="score-item">
        <strong>Time left:</strong> {{ gameService.calculateRemainingTime() }}
      </div>
      <div class="score-item">
        <strong>Correct:</strong> {{ gameService.correctChars }} char
      </div>
      <div class="score-item">
        <strong>Incorrect:</strong> {{ gameService.incorrectChars }} char
      </div>
    </div>
  </div>
</div>
